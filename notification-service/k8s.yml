apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cinema
spec:
  selector:
    app: notification-service
  ports:
    - port: 3005
