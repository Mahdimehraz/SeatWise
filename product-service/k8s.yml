apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cinema-env
                  key: PRODUCT_DB_NAME
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: product-db
  namespace: cinema
spec:
  selector:
    app: product-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DB_HOST
              value: product-db
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: cinema
spec:
  selector:
    app: product-service
  ports:
    - port: 3002
