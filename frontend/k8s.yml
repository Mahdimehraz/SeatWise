apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cinema
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
