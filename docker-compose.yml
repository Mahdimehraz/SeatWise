version: '3.8'

services:
  # PostgreSQL databases
  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:15-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      product-db:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      - order-db
      - product-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_USER_SERVICE_URL: http://user-service:3001
        NEXT_PUBLIC_PRODUCT_SERVICE_URL: http://product-service:3002
        NEXT_PUBLIC_ORDER_SERVICE_URL: http://order-service:3003
        NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://185.110.190.146:3004
    container_name: cinema-booking-frontend
    ports:
      - "5000:3000"
    environment:
      NEXT_PUBLIC_USER_SERVICE_URL: http://user-service:3001
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: http://product-service:3002
      NEXT_PUBLIC_ORDER_SERVICE_URL: http://order-service:3003
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://185.110.190.146:3004
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.frontend.rule=Host(`cinema.kojiberi.com`)"
      - "traefik.http.routers.frontend.entrypoints=http,https"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # - "traefik.http.routers.frontend.middlewares=traefik-auth"
    networks:
      - web


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      - KAFKA_BROKER=kafka:9092
      - PORT=3004
    ports:
      - "3004:3004"
    depends_on:
      - kafka

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      - KAFKA_BROKER=kafka:9092
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password
    ports:
      - "3005:3005"
    depends_on:
      - kafka

volumes:
  user_db_data:
  product_db_data:
  order_db_data:

networks:
  web:
    external: true