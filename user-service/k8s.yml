apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cinema-env
                  key: USER_DB_NAME
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: cinema
spec:
  selector:
    app: user-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: user-db
            - name: DB_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: cinema
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
