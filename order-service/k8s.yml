apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cinema-env
                  key: ORDER_DB_NAME
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: cinema
spec:
  selector:
    app: order-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: order-db
            - name: DB_PORT
              value: "5432"
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:3002
          envFrom:
            - secretRef:
                name: cinema-env
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cinema
spec:
  selector:
    app: order-service
  ports:
    - port: 3003
